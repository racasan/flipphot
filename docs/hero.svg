<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1200 420" width="1200" height="420" role="img" aria-label="Illustration of two tablets running Flipphot: one showing a full-screen photo, one showing the low-battery warning">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B4C7E"/>
      <stop offset="0.45" stop-color="#E8896B"/>
      <stop offset="0.62" stop-color="#FFD08A"/>
    </linearGradient>
    <linearGradient id="lake" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#E9A27A"/>
      <stop offset="1" stop-color="#27456F"/>
    </linearGradient>
    <clipPath id="screen">
      <rect width="496" height="310" rx="4"/>
    </clipPath>

    <!-- the "photo": a lake at sunset -->
    <g id="photo" clip-path="url(#screen)">
      <rect width="496" height="310" fill="url(#sky)"/>
      <circle cx="330" cy="176" r="34" fill="#FFF1C9"/>
      <!-- far hills -->
      <path d="M0 190 L70 150 L150 182 L230 138 L320 186 L400 160 L496 192 L496 210 L0 210 Z" fill="#6C5B7B"/>
      <!-- lake -->
      <rect y="204" width="496" height="106" fill="url(#lake)"/>
      <!-- sun reflection -->
      <g fill="#FFF1C9" opacity="0.75">
        <rect x="304" y="212" width="52" height="4" rx="2"/>
        <rect x="312" y="224" width="36" height="4" rx="2"/>
        <rect x="300" y="237" width="60" height="4" rx="2"/>
        <rect x="318" y="251" width="24" height="4" rx="2"/>
        <rect x="308" y="266" width="44" height="4" rx="2"/>
      </g>
      <!-- near shore with trees -->
      <path d="M0 204 L0 150 L14 118 L28 150 L40 104 L56 152 L70 126 L84 160 L104 140 L122 176 L150 196 L180 204 Z" fill="#1F2A38"/>
      <path d="M496 204 L496 168 L480 140 L466 172 L452 152 L438 184 L410 204 Z" fill="#1F2A38"/>
      <!-- foreground bank -->
      <path d="M0 310 L0 272 Q90 250 190 284 Q240 300 270 310 Z" fill="#141C27"/>
    </g>

    <!-- tablet body, screen origin at (22,20) -->
    <g id="tablet">
      <rect width="540" height="350" rx="22" fill="#23272E"/>
      <rect x="1.5" y="1.5" width="537" height="347" rx="20.5" fill="none" stroke="#4A515C" stroke-width="3"/>
      <circle cx="11" cy="175" r="3" fill="#4A515C"/>
      <rect x="22" y="20" width="496" height="310" fill="#000"/>
    </g>
  </defs>

  <!-- left: slideshow -->
  <g transform="translate(40 35)">
    <use xlink:href="#tablet" href="#tablet"/>
    <g transform="translate(22 20)">
      <use xlink:href="#photo" href="#photo"/>
    </g>
  </g>

  <!-- right: low-battery warning -->
  <g transform="translate(620 35)">
    <use xlink:href="#tablet" href="#tablet"/>
    <g transform="translate(22 20)">
      <use xlink:href="#photo" href="#photo"/>
      <rect x="98" y="14" width="300" height="40" fill="#D32F2F"/>
      <text x="248" y="40" text-anchor="middle" font-family="Helvetica, Arial, sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Battery low: 7%  -  plug in the charger</text>
    </g>
  </g>
</svg>
