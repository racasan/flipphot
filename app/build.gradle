plugins {
    id 'com.android.application'
}

android {
    namespace 'com.flipphot'
    compileSdk 36

    defaultConfig {
        applicationId 'com.flipphot'
        minSdk 24          // Huawei MediaPad T3 10 runs Android 7.0
        targetSdk 36
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            // Optimised, non-debuggable build. Signed with the debug key so it
            // can be sideloaded straight onto the tablet.
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt')
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

// No dependencies on purpose: plain Android framework only.
